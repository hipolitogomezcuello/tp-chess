<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="551px" preserveAspectRatio="none" style="width:1210px;height:551px;background:#FFFFFF;" version="1.1" viewBox="0 0 1210 551" width="1210px" zoomAndPan="magnify"><title>Estados de la partida</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="140.8203" x="526.8398" y="24.5332">Estados de la partida</text><!--cluster InProgressPhase--><g id="cluster_InProgressPhase"><path d="M26.5,112.6094 L440.5,112.6094 A12.5,12.5 0 0 1 453,125.1094 L453,152.8281 L14,152.8281 L14,125.1094 A12.5,12.5 0 0 1 26.5,112.6094 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="432.5" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="439" x="14" y="112.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="14" x2="453" y1="152.8281" y2="152.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3926" x="179.8037" y="127.1426">InProgressPhase</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2891" x="181.3555" y="144.752">(acepta jugadas)</text></g><!--cluster GameOverPhase--><g id="cluster_GameOverPhase"><path d="M473.5,262.6094 L881.5,262.6094 A12.5,12.5 0 0 1 894,275.1094 L894,302.8281 L461,302.8281 L461,275.1094 A12.5,12.5 0 0 1 473.5,262.6094 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="122" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="433" x="461" y="262.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="461" x2="894" y1="302.8281" y2="302.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.1582" x="623.4209" y="277.1426">GameOverPhase</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="261.4268" x="546.7866" y="294.752">(rechaza jugadas: MoveError::GameOver)</text></g><ellipse cx="197" cy="52.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN20"><path d="M904.5,272.1094 L904.5,412.9219 L1203.7051,412.9219 L1203.7051,282.1094 L1193.7051,272.1094 L904.5,272.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1193.7051,272.1094 L1193.7051,282.1094 L1203.7051,282.1094 L1193.7051,272.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.7891" x="910.5" y="290.6045">State</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2217" x="945.9009" y="290.6045">(arquitectura &#167;3.7)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.9688" x="910.5" y="306.9561">La fase no se guarda en el historial:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.9014" x="910.5" y="323.3076">despu&#233;s de cada jugada, undo o redo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.4624" x="910.5" y="339.6592">ChessGame::updatePhase() la deriva del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9561" x="910.5" y="356.0107">GameStatus. Por eso deshacer un mate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.2051" x="910.5" y="372.3623">vuelve a InProgressPhase sin casos especiales.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9351" x="910.5" y="388.7139">redo() desde InProgressPhase puede volver a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0234" x="910.5" y="405.0654">llevar a Checkmate/Stalemate.</text></g><g id="elem_GMN23"><path d="M463,141.1094 L463,200.1641 L726.7788,200.1641 L726.7788,151.1094 L716.7788,141.1094 L463,141.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M716.7788,141.1094 L716.7788,151.1094 L726.7788,151.1094 L716.7788,141.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.4624" x="469" y="159.6045">Jugada inv&#225;lida: no hay transici&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.7788" x="469" y="175.9561">ChessGame devuelve MoveResult::failure</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.0762" x="469" y="192.3076">y el estado no cambia.</text></g><ellipse cx="123" cy="168.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="InProgressPhase.InProgress"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="124.7539" x="60.5" y="316.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="60.5" x2="185.2539" y1="343.7188" y2="343.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.6963" x="89.0288" y="335.6426">InProgress</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104.7539" x="65.5" y="361.1758">nadie est&#225; en jaque</text></g><g id="InProgressPhase.Check"><rect fill="#F1F1F1" height="67.7969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.1426" x="33" y="469.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="33" x2="237.1426" y1="496.7188" y2="496.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6826" x="115.23" y="488.6426">Check</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.1426" x="38" y="514.1758">el bando que mueve est&#225; en jaque</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.0723" x="38" y="529.2695">&#8594; observers.onCheck(color)</text></g><g id="GameOverPhase.Checkmate"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180.7813" x="469.5" y="316.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="469.5" x2="650.2813" y1="343.7188" y2="343.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.8066" x="524.4873" y="335.6426">Checkmate</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.7813" x="474.5" y="361.1758">en jaque y sin jugadas legales</text></g><g id="GameOverPhase.Stalemate"><rect fill="#F1F1F1" height="67.7969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182.7734" x="668.5" y="308.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="668.5" x2="851.2734" y1="336.2188" y2="336.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.0342" x="728.3696" y="328.1426">Stalemate</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.7734" x="673.5" y="353.6758">sin jaque y sin jugadas legales</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.7422" x="673.5" y="368.7695">(tablas por ahogado)</text></g><polygon fill="#181818" points="197,112.2386,201,103.2386,197,107.2386,193,103.2386,197,112.2386" style="stroke:#181818;stroke-width:1.0;"/><path d="M197,66.9569 C197,72.4198 197,79.4972 197,87.3813 C197,91.3234 197,95.4671 197,99.7115 C197,101.8337 197,103.9811 197,106.1411 C197,